name: test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      geckodriver:
        image: selenium/standalone-firefox:133.0-20250101
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2"
          gleam-version: "1.7"
          rebar3-version: "3"
          # elixir-version: "1.15.4"
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam test
